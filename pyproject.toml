[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-deepfake-factcheck"
version = "1.0.0"
description = "A Hybrid Multimodal Deepfake Forensics and Semantic Fact-Checking System"
readme = "README.md"
authors = [
    { name = "Praveen Kumar Chilukuri", email = "praveenkumar.cq@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "opencv-python>=4.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "streamlit>=1.28.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
